[project]
name = "codex-taskboard"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "psutil>=7,<8; sys_platform == 'win32'",
]

[project.scripts]
codex-taskboard = "codex_taskboard.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
